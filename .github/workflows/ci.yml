name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: routineescape_test_ci
          POSTGRES_USER: routineescape
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routineescape -d routineescape_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROUTINEESCAPE_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=routineescape_test_ci;Username=routineescape;Password=ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
